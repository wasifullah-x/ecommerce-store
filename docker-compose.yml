version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bazaar-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bazaar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bazaar-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/pakistan-bazaar
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - bazaar-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bazaar-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bazaar-network

volumes:
  mongodb_data:


networks:
  bazaar-network:
    driver: bridge
